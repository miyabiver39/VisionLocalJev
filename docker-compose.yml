services:
  # Main Vision-Jev Guard Platform (Powered by DiffusionGemma-Jev)
  vision-guard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/miyabiver39/visionlocaljev:latest
    container_name: vision-guard-platform
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Video & Device Configuration
      - CAMERA_SOURCE=synthetic       # synthetic, 0, /dev/video0, rtsp://..., or YouTube URL
      - DEVICE=cpu                    # cpu | cuda
      - SAMPLE_FPS=1.0                # Frame inference sample rate per camera
      - ALERT_THRESHOLD=0.80          # Alert trigger threshold (0.1 - 0.99)

      # Vision & DiffusionGemma-Jev (DJev) Engine
      - VISION_MODE=detector          # detector (CPU Real CV) | mock | vlm
      - DECISION_ENGINE=diffusion-gemma-jev
      - DJEV_MODE=embedded            # embedded (CPU emulator) | remote (TypeSafe System One compatible server)
      - DJEV_SERVER_URL=http://host.docker.internal:8765/v1/systemone
      - DJEV_MODEL=jev-latest         # jev-latest / imajev-4b / qev:0.8b ...
      - DJEV_API_KEY=${DJEV_API_KEY:-}
      - DJEV_IMAGE_MODE=images        # images (imajev) | state_content (Qev) | none (TypeSafe Jev / Kev)
      - DJEV_TIMEOUT=10

      # RAG Configuration (Embedded by default, or point to external server)
      - RAG_SERVER_URL=

      # Security: set both to require HTTP Basic auth on all pages/APIs/feeds/WebSocket
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}

    volumes:
      - ./app/presets:/app/app/presets:ro
      # YouTube BotGuard対策の cookies.txt を使う場合は以下を有効化
      # - ./cookies.txt:/app/cookies.txt:ro

    # Linuxホストの物理Webカメラをマウントする場合（Windows/Macではコメントアウト推奨）
    # devices:
    #   - "/dev/video0:/dev/video0"

    # カメラデバイス権限エラー（Permission denied）が発生する場合に有効化
    # privileged: true

    # NVIDIA GPU（CUDA/TensorRT）を利用する場合の定義
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
