# Vision-Jev Guard Platform
#
#   アプリのみ (判定は CPU エミュレータ):
#     docker compose up -d --build
#
#   AMD GPU (Windows + WSL2 / Docker Desktop) で imajev を同時に起動:
#     docker compose -f docker-compose.yml -f docker-compose.imajev-amd.yml up -d --build
#
#   NVIDIA GPU で imajev を同時に起動:
#     docker compose -f docker-compose.yml -f docker-compose.imajev-nvidia.yml up -d --build
#
# 設定は環境変数 または .env で上書きできる (.env.example を参照)。
services:
  vision-guard:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/miyabiver39/visionlocaljev:latest
    container_name: vision-guard-platform
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Video
      - CAMERA_SOURCE=${CAMERA_SOURCE:-synthetic}   # synthetic, 0, /dev/video0, rtsp://..., HLS or YouTube URL
      - SAMPLE_FPS=${SAMPLE_FPS:-1.0}               # Inference sampling rate per camera
      - ALERT_THRESHOLD=${ALERT_THRESHOLD:-0.80}    # Alert trigger threshold (0.1 - 0.99)
      - VISION_MODE=${VISION_MODE:-detector}        # detector (CPU CV) | mock | vlm

      # Decision engine (TypeSafe System One)
      - DJEV_MODE=${DJEV_MODE:-embedded}            # embedded (CPU emulator) | remote (TypeSafe System One compatible server)
      - DJEV_SERVER_URL=${DJEV_SERVER_URL:-http://host.docker.internal:8765/v1/systemone}
      - DJEV_MODEL=${DJEV_MODEL:-jev-latest}        # jev-latest / imajev-4b / qev:0.8b ...
      - DJEV_API_KEY=${DJEV_API_KEY:-}
      - DJEV_IMAGE_MODE=${DJEV_IMAGE_MODE:-images}  # images (imajev) | state_content (Qev) | none (TypeSafe Jev / Kev)
      - DJEV_TIMEOUT=${DJEV_TIMEOUT:-10}

      # RAG (embedded by default, or an external RAG server)
      - RAG_SERVER_URL=${RAG_SERVER_URL:-}

      # Security: set both to require HTTP Basic auth on all pages/APIs/feeds/WebSocket
      - AUTH_USERNAME=${AUTH_USERNAME:-}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}

    volumes:
      - ./app/presets:/app/app/presets:ro
      # YouTube BotGuard対策の cookies.txt を使う場合は以下を有効化
      # - ./cookies.txt:/app/cookies.txt:ro

    # Linuxホストの物理Webカメラをマウントする場合（Windows/Macではコメントアウト推奨）
    # devices:
    #   - "/dev/video0:/dev/video0"
